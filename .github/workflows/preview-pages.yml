# ─────────────────────────────────────────────────────────────────────────────
# PR Preview — GitHub Pages (Static Next.js)
# ─────────────────────────────────────────────────────────────────────────────
# Automatically builds and deploys a static preview of every Pull Request
# to a unique GitHub Pages subdirectory so reviewers can see changes live
# without pulling the code or running anything locally.
#
# Use Case: Content contributors (writers, editors, designers) submit articles
# or UI changes via PRs. This workflow lets them instantly preview the result.
#
# Architecture:
#   PR opened → Next.js static build (output: "export") → push to gh-pages
#   branch under pr-preview/pr-<N>/ → bot posts preview URL as PR comment
# ─────────────────────────────────────────────────────────────────────────────

name: "📄 PR Preview — GitHub Pages"

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

env:
  NODE_VERSION: "20"

jobs:
  # ── Deploy Preview ──────────────────────────────────────────────────────────
  deploy-preview:
    name: "Deploy PR Preview"
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      # ── Determine PR number ────────────────────────────────────────────
      - name: Set PR number
        run: echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Set PR SHA
        run: echo "PR_SHA=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_ENV

      # ── Checkout PR code ───────────────────────────────────────────────
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      # ── Setup & Build ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      # Build with basePath pointing to the preview subdirectory
      - name: Build Next.js (static export)
        run: |
          # Backup original config
          cp next.config.mjs next.config.mjs.bak
          
          # Override basePath for the PR preview subdirectory
          cat > next.config.mjs << 'EOF'
          const nextConfig = {
            output: 'export',
            trailingSlash: true,
            eslint: { ignoreDuringBuilds: true },
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
            basePath: '/StableViewpoints/pr-preview/pr-${{ env.PR_NUMBER }}',
          }
          export default nextConfig;
          EOF
          
          # Build using the overwritten config
          npx next build
          
          # Restore original config
          mv next.config.mjs.bak next.config.mjs

      # ── Deploy to gh-pages subdirectory ────────────────────────────────
      - name: Deploy preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save build output
          cp -r out /tmp/pr-preview-dist

          # Switch to gh-pages branch (create if doesn't exist)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages

          # Deploy to unique subdirectory for this PR
          mkdir -p pr-preview/pr-${{ env.PR_NUMBER }}
          rm -rf pr-preview/pr-${{ env.PR_NUMBER }}/*
          cp -r /tmp/pr-preview-dist/* pr-preview/pr-${{ env.PR_NUMBER }}/

          # Add .nojekyll to prevent GitHub from processing files
          touch .nojekyll

          git add pr-preview/pr-${{ env.PR_NUMBER }} .nojekyll
          git commit -m "Deploy preview for PR #${{ env.PR_NUMBER }} (${{ env.PR_SHA }})" || echo "No changes"
          git push origin gh-pages

      # ── Post/update PR comment ─────────────────────────────────────────
      - name: Find existing preview comment
        uses: peter-evans/find-comment@v3
        id: find_comment
        with:
          issue-number: ${{ env.PR_NUMBER }}
          comment-author: "github-actions[bot]"
          body-includes: "PR Preview Deployed"

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ env.PR_NUMBER }}
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## 📄 PR Preview Deployed!

            | Detail | Value |
            |--------|-------|
            | **Preview URL** | [🔗 Open Preview](https://${{ github.repository_owner }}.github.io/StableViewpoints/pr-preview/pr-${{ env.PR_NUMBER }}/) |
            | **Commit** | `${{ env.PR_SHA }}` |
            | **Built at** | ${{ github.event.pull_request.updated_at }} |

            > This is a **static Next.js** build deployed to GitHub Pages.
            > Since the app is 100% static (`output: "export"`), no server is needed.
            > The preview updates automatically on every push to this PR.

  # ── Cleanup Preview on PR Close ─────────────────────────────────────────
  cleanup-preview:
    name: "Cleanup PR Preview"
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          if [ -d "pr-preview/pr-${PR_NUMBER}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            rm -rf "pr-preview/pr-${PR_NUMBER}"
            git add -A
            git commit -m "Remove preview for PR #${PR_NUMBER}" || echo "No changes"
            git push origin gh-pages
          fi

      - name: Update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## 📄 PR Preview Removed

            The preview for this PR has been cleaned up since the PR was closed.
